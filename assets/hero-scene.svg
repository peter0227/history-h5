<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">史前黄昏场景插画</title>
  <desc id="desc">一名少年探险者站在岩石上，望向远处的洞穴、篝火和远古人类。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2c31"/>
      <stop offset="0.38" stop-color="#1f5a58"/>
      <stop offset="0.66" stop-color="#c97a48"/>
      <stop offset="0.84" stop-color="#f2b35f"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4c8" stop-opacity="0.98"/>
      <stop offset="0.22" stop-color="#ffd27a" stop-opacity="0.82"/>
      <stop offset="0.62" stop-color="#ff9a4a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e6c67"/>
      <stop offset="1" stop-color="#174a4a"/>
    </linearGradient>
    <linearGradient id="midMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17413f"/>
      <stop offset="1" stop-color="#0c2d2d"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153b37"/>
      <stop offset="1" stop-color="#071b1b"/>
    </linearGradient>
    <linearGradient id="caveGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc066" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c44d2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.075"/></feComponentTransfer>
    </filter>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#ffe2a6" opacity="0.18"/>
    </pattern>
    <clipPath id="caveClip">
      <path d="M1040 710 C1015 610 1045 500 1110 430 C1175 360 1260 355 1320 420 C1390 495 1405 600 1380 710 Z"/>
    </clipPath>
  </defs>

