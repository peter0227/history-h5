<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">北京人头骨化石风格插画</title>
  <desc id="desc">一幅风格化的北京人头骨正面插画，突出低平前额、粗大眉骨、前伸嘴部等特征。</desc>
  <defs>
    <radialGradient id="bg" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe0a1"/>
      <stop offset=".6" stop-color="#f2b45a"/>
      <stop offset="1" stop-color="#d97b3d"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d8"/>
      <stop offset=".55" stop-color="#efd9ad"/>
      <stop offset="1" stop-color="#cba76f"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#5d351f" opacity=".18"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#5d351f" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="420" height="420" rx="32" fill="url(#bg)"/>
  <rect width="420" height="420" rx="32" fill="url(#dots)"/>
